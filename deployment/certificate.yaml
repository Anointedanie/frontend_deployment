apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls-cert
  namespace: ecommerce-frontend-ns
spec:
  secretName: ecommerce-frontend-tls-secret
  issuerRef:
    # PRODUCTION - Trusted SSL certificates (limited to 5 certs/week)
    name: letsencrypt-prod
    # For testing (unlimited requests), use: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - shop.emchrismobility.com