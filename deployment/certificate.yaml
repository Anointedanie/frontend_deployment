apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls-cert
  namespace: ecommerce-frontend-ns
spec:
  secretName: frontend-tls-secret
  issuerRef:
    # PRODUCTION - Trusted SSL certificates (limited to 5 certs/week)
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - admin.emchrismobility.com